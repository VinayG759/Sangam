# Run the whole backend locally with one command:
#   docker compose up --build
# API: http://localhost:8000/docs   Frontend: cd frontend && npm run dev

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sangam
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]  # 5433 on your machine, so it never clashes with a local Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sangam"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    ports: ["${API_PORT:-8000}:8000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sangam
      ACTIVE_COUNTRY_PACK: india
      ALLOWED_ORIGINS: http://localhost:5173
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-admin-token}
      REPORTER_HASH_PEPPER: ${REPORTER_HASH_PEPPER:-local-development-pepper}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
