# ─────────────────────────────────────────────────────────────────────────────
# Sangam — CI Pipeline
# ─────────────────────────────────────────────────────────────────────────────
# Runs on every push and pull request to main.
# Steps: lint → unit tests → (optionally) build Docker image
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short -q
        env:
          # Use a dummy PostgreSQL URL so that create_async_engine can resolve the asyncpg driver
          # (all actual database calls are mocked during tests).
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/sangam"
          ACTIVE_COUNTRY_PACK: "india_karnataka"
          PACKS_DIR: "../packs"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build -t sangam-backend:ci ./backend

      - name: Verify image runs
        run: |
          # Start container in background
          docker run -d --name test-backend \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/sangam \
            -e ACTIVE_COUNTRY_PACK=default \
            -e PACKS_DIR=../packs \
            -p 8000:8000 \
            sangam-backend:ci || true
          sleep 5
          docker logs test-backend || true
          docker stop test-backend || true
          docker rm test-backend || true
