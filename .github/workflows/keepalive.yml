# Keeps the live demo awake and fresh.
#
# Render's free tier sleeps after 15 idle minutes and Supabase pauses a free
# project after 7 days without queries, so a scheduled ping keeps both awake.
# If the SANGAM_ADMIN_TOKEN secret is set, each run also finishes any
# reports that arrived while Gemini was unavailable, tells citizens whose
# reports reached the priority list, and re-runs the analysis.
# (Updates use the previous run, so they lag by at most one cycle.)
#
# Secrets (Settings → Secrets and variables → Actions):
#   SANGAM_API_URL      e.g. https://sangam-api.onrender.com
#   SANGAM_ADMIN_TOKEN  same value as ADMIN_TOKEN on Render (optional)

name: keepalive

on:
  schedule:
    - cron: "0 */12 * * *"  # every 12 hours
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ secrets.SANGAM_API_URL }}
      ADMIN_TOKEN: ${{ secrets.SANGAM_ADMIN_TOKEN }}
    steps:
      - name: Wake the API and touch the database
        run: |
          if [ -z "$API_URL" ]; then echo "SANGAM_API_URL not set - skipping."; exit 0; fi
          curl -fsS --max-time 120 "$API_URL/health"
          echo
          curl -fsS --max-time 120 -o /dev/null -w "overview: HTTP %{http_code}\n" "$API_URL/api/v1/overview"
      - name: Reprocess waiting reports, send status updates, re-run the analysis
        if: env.ADMIN_TOKEN != '' && env.API_URL != ''
        run: |
          curl -fsS --max-time 300 -X POST -H "Authorization: Bearer $ADMIN_TOKEN" "$API_URL/api/v1/admin/reprocess"
          echo
          curl -fsS --max-time 120 -X POST -H "Authorization: Bearer $ADMIN_TOKEN" "$API_URL/api/v1/admin/notify"
          echo
          curl -fsS --max-time 60 -X POST -H "Authorization: Bearer $ADMIN_TOKEN" "$API_URL/api/v1/admin/runs"
