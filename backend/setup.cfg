[importlinter]
root_package = app

# Features communicate through database tables (app.models), never by
# importing each other's code. See docs/implementation-plan.md §5.3.
[importlinter:contract:features-independent]
name = Features never import each other
type = independence
modules =
    app.features.analysis
    app.features.export
    app.features.intake
    app.features.overview
    app.features.packs
    app.features.priorities
    app.features.regions
    app.features.reports
    app.features.simulator

# Shared plumbing must not depend on any feature.
[importlinter:contract:core-below-features]
name = Core and models never import features
type = forbidden
source_modules =
    app.core
    app.models
forbidden_modules =
    app.features
